; LILYGO T-QT Pro (SKU H579), ESP32-S3FN4R2: 4MB flash, 2MB Quad PSRAM.
; Verified against manufacturer/retailer specs (tinytronics.nl H579 listing,
; CNX Software), not assumed from a generic devkit board definition.
[platformio]
default_envs = tqtpro

[env:tqtpro]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.8
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
; board_build.flash_size alone does NOT change partition table selection -
; it still defaulted to the 8MB scheme from this board's base definition,
; writing a partition table that doesn't fit this chip's actual 4MB and
; crash-looping it before any app code (including the display) could run.
; ota_nofs_4MB.csv keeps dual OTA app slots (for the planned OTA mode)
; without needing SPIFFS, which we don't use.
board_build.partitions = ota_nofs_4MB.csv
; The generic DevKitC board definition forces USB_MODE=1 (fixed-function
; USB-Serial/JTAG). Remove that board-level define before selecting native
; USB-OTG/TinyUSB below, otherwise the compiler receives contradictory values.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ; Keep NimBLE's default repeat-pairing handler from replacing saved bonds
    ; outside the physical pairing window. See the GAP callback wrapper.
    -Wl,--wrap=ble_gap_adv_start
    ; USB_MODE=0 selects the native USB-OTG/TinyUSB path (required for HID) -
    ; USB_MODE=1 selects the separate, fixed-function USB-Serial-JTAG debug
    ; peripheral instead, which cannot do HID at all. Verified by testing:
    ; with mode=1 the board kept enumerating as the stock JTAG/serial debug
    ; unit, completely unaffected by this firmware.
    -DARDUINO_USB_MODE=0
    ; Keep framework auto-start off. The Arduino core otherwise constructs
    ; CDC and calls USB.begin() before setup(), locking a composite descriptor
    ; before firmware can choose the programming or HID personality.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    ; PlatformIO's LDF doesn't wire FS's include path into the (unused by us)
    ; USB library Host-mode/MSC files that need it - added directly, using
    ; PlatformIO's own packages_dir variable so this stays portable.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
monitor_speed = 115200

; Base ESP32-S3-Touch-LCD-7 (Ver1.1), NOT the 7B/7C models.
; Conservative 8MB layout also fits N8R8 modules used on earlier revisions.
[env:waveshare7]
extends = env:tqtpro
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
    ${env:tqtpro.build_flags}
    -DWITS_BOARD_WAVESHARE7=1
    ; Capture the RGB driver handle for public-API cleanup before esp_restart.
    ; Retain together with __wrap_esp_lcd_new_rgb_panel in the Waveshare UI.
    -Wl,--wrap=esp_lcd_new_rgb_panel
    ; Complete cache flushes and return signed errors for generic SCSI requests.
    -Wl,--wrap=tud_msc_scsi_cb
build_src_filter = +<*> -<status_display.cpp>
