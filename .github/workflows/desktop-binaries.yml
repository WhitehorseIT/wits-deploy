name: Desktop binaries
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build all board images in an isolated release directory
        env:
          WITS_RELEASE_ROOT: ${{ github.workspace }}/build/firmware
          PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
        run: |
          python -m venv .venv-pio
          .venv-pio/bin/python -m pip install platformio==6.2.0
          version=$(cat desktop/packaging/firmware-release.txt)
          for target in tqtpro waveshare7 waveshare147; do
            bash scripts/build-release.sh "$version" "$target"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: included-firmware
          path: build/firmware/*
          if-no-files-found: error
          retention-days: 30
  build:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            desktop/requirements-build.txt
            desktop/requirements-release.txt
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libopengl0
      - name: Install build dependencies
        run: python -m pip install -r desktop/requirements-build.txt
      - uses: actions/download-artifact@v7
        with:
          name: included-firmware
          path: build/included-firmware
      - name: Build, test and package
        shell: bash
        run: |
          version=$(cat desktop/packaging/firmware-release.txt)
          python scripts/build-desktop.py --output dist/native --firmware "build/included-firmware/$version/WITS-Keyboard-Release-$version.ota.json"
      - uses: actions/upload-artifact@v7
        with:
          name: WITS-Deploy-${{ runner.os }}-x64
          path: dist/native/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
