name: wits-keyboard

services:
  web:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: wits-keyboard-web
    restart: unless-stopped
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - keyboard

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wits-keyboard-tunnel
    restart: unless-stopped
    user: "${WITS_UID:-1000}:${WITS_GID:-1000}"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel_token
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - tunnel_token
    depends_on:
      web:
        condition: service_healthy
    networks:
      - keyboard

networks:
  keyboard:
    name: wits-keyboard

secrets:
  tunnel_token:
    file: ./secrets/tunnel-token
