name: Release
# Push a tag such as v0.2.0-dev19 (it must match the version files) to build, sign and publish.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the tag matches the version files
        run: |
          version=$(cat desktop/packaging/firmware-release.txt)
          app=$(python -c "import re;print(re.search(r'__version__ = \"(.*?)\"', open('desktop/wits_keyboard/__init__.py').read()).group(1))")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] && [ "$app" = "$version" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version} / app ${app}" >&2; exit 1; }
      - name: Check the documentation matches the code
        run: python scripts/check-docs.py
      - name: Build all board images
        env:
          WITS_RELEASE_ROOT: ${{ github.workspace }}/build/firmware
          PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
        run: |
          python -m venv .venv-pio
          .venv-pio/bin/python -m pip install platformio==6.2.0
          version=$(cat desktop/packaging/firmware-release.txt)
          for target in tqtpro waveshare7 waveshare147; do
            bash scripts/build-release.sh "$version" "$target"
          done
      - name: Package the firmware bundle
        run: |
          python -m pip install -r desktop/requirements-build.txt
          version=$(cat desktop/packaging/firmware-release.txt)
          python scripts/package-ota-release.py "build/firmware/$version/WITS-Deploy-Release-$version.ota.json"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: build/firmware/*
          if-no-files-found: error
  linux:
    needs: firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libopengl0
      - run: python -m pip install -r desktop/requirements-build.txt
      - uses: actions/download-artifact@v7
        with:
          name: firmware
          path: build/included-firmware
      - name: Build, test and package
        run: |
          version=$(cat desktop/packaging/firmware-release.txt)
          python scripts/build-desktop.py --output dist/native --firmware "build/included-firmware/$version/WITS-Deploy-Release-$version.ota.json"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/native/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: [firmware, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/requirements-build.txt
      - uses: actions/download-artifact@v7
        with:
          name: firmware
          path: build/firmware
      - uses: actions/download-artifact@v7
        with:
          name: linux
          path: build/linux
      - name: Build, sign and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          WITS_RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version=$(cat desktop/packaging/firmware-release.txt)
          [ -n "$WITS_RELEASE_SIGNING_KEY" ] || { echo "The RELEASE_SIGNING_KEY secret is not set." >&2; exit 1; }
          mkdir -p out
          cp "build/firmware/$version/WITS-Deploy-Firmware-$version.zip" "build/firmware/$version/WITS-Deploy-Firmware-$version.zip.sha256" out/
          cp build/linux/WITS-Deploy-*-Linux-x86_64.tar.gz build/linux/WITS-Deploy-*-Linux-x86_64.tar.gz.sha256 out/
          critical=""
          [ -f docs/release-notes/critical-below.txt ] && critical=$(tr -d '[:space:]' < docs/release-notes/critical-below.txt)
          python scripts/release-signing.py manifest --version "$version" ${critical:+--critical-below "$critical"} \
            --asset "firmware=out/WITS-Deploy-Firmware-$version.zip" \
            --asset "linux-x86_64=$(ls out/WITS-Deploy-*-Linux-x86_64.tar.gz)" --out out/release-manifest.json
          python scripts/release-signing.py sign out/release-manifest.json
          notes="docs/release-notes/$version.md"
          [ -f "$notes" ] || { printf 'Test build %s. See the README for installation.\n' "$version" > notes.md; notes=notes.md; }
          prerelease=""
          case "$version" in *-dev*|*-rc*) prerelease="--prerelease" ;; esac
          gh release create "v$version" $prerelease --title "WITS Deploy $version" --notes-file "$notes" out/*
