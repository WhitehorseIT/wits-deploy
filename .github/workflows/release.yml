name: Release
# App release. Push a tag such as v0.2.0-dev23 (it must match the app version) to build the Linux app,
# sign the manifest and publish. The app bundles the already published firmware named in
# desktop/packaging/firmware-release.txt; firmware is released separately (see firmware-release.yml).
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - name: Check the tag and the documentation
        run: |
          app=$(python -c "import re;print(re.search(r'__version__ = \"(.*?)\"', open('desktop/wits_keyboard/__init__.py').read()).group(1))")
          [ "${GITHUB_REF_NAME}" = "v${app}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match the app version ${app}" >&2; exit 1; }
          python scripts/check-docs.py
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libopengl0
      - run: python -m pip install -r desktop/requirements-build.txt
      - name: Fetch the published firmware to bundle
        run: |
          version=$(cat desktop/packaging/firmware-release.txt)
          manifest=$(python scripts/fetch-firmware-release.py "$version" --out build/included-firmware)
          echo "FIRMWARE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Build, test and package
        run: python scripts/build-desktop.py --output dist/native --firmware "$FIRMWARE_MANIFEST"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/native/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/requirements-build.txt
      - uses: actions/download-artifact@v7
        with:
          name: linux
          path: build/linux
      - name: Build, sign and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          WITS_RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.*?)\"', open('desktop/wits_keyboard/__init__.py').read()).group(1))")
          [ -n "$WITS_RELEASE_SIGNING_KEY" ] || { echo "The RELEASE_SIGNING_KEY secret is not set." >&2; exit 1; }
          mkdir -p out
          cp build/linux/WITS-Deploy-*-Linux-x86_64.tar.gz build/linux/WITS-Deploy-*-Linux-x86_64.tar.gz.sha256 out/
          critical=""
          [ -f docs/release-notes/critical-below-app.txt ] && critical=$(tr -d '[:space:]' < docs/release-notes/critical-below-app.txt)
          python scripts/release-signing.py manifest --kind app --version "$version" ${critical:+--critical-below "$critical"} \
            --asset "linux-x86_64=$(ls out/WITS-Deploy-*-Linux-x86_64.tar.gz)" --out out/release-manifest.json
          python scripts/release-signing.py sign out/release-manifest.json
          prerelease=""
          case "$version" in *-dev*|*-rc*) prerelease="--prerelease" ;; esac
          gh release create "v$version" $prerelease --title "WITS Deploy $version" \
            --notes-file "docs/release-notes/$version.md" out/*
